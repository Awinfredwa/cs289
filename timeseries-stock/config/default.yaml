data:
  input_csv: "data/raw/SAMPLE.csv"  # Use SAMPLE.csv for testing, replace with your data
  date_col: "date"
  cols: ["open", "high", "low", "close", "volume"]
  target: "direction"   # options: "direction" | "return"
  prediction_horizon: 5  # days ahead to predict (1=next day, 5=next week)
  cache_processed: true

sentiment:
  enabled: true  # Set to true to include sentiment features
  csv_path: "data/raw/Daily News Sentiment Index.csv"

features:
  rsi_period: 14
  roll_means: [5, 20]      # Keep short-term (5) and medium-term (20), drop redundant 10
  roll_stds: [10]          # Keep mid-range volatility, drop 5 and 20 (highly correlated)
  macd:
    fast: 12
    slow: 26
    signal: 9
  volume_windows: [20]     # Keep medium-term only, drop redundant 5 and 50

window:
  size: 20  # 20 days (4 weeks) look-back for weekly prediction
  stride: 1

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  chronological: true

model:
  type: "lstm"           # options: "lstm" | "cnn1d"
  hidden_size: 32
  num_layers: 1
  dropout: 0.3

train:
  epochs: 30
  batch_size: 16
  lr: 0.001
  optimizer: "adam"
  early_stop_patience: 7 # Slightly more patience for weekly prediction
  task: "classification" # or "regression"
  seed: 44

paths:
  outdir: "artifacts/"

