data:
  input_csv: "data/raw/SAMPLE.csv"  # Use SAMPLE.csv for testing, replace with your data
  date_col: "date"
  cols: ["open", "high", "low", "close", "volume"]
  target: "direction"   # options: "direction" | "return"
  prediction_horizon: 1  # days ahead to predict (1=next day, 5=next week)
  cache_processed: true

sentiment:
  enabled: true  # Set to true to include sentiment features
  csv_path: "data/raw/Daily News Sentiment Index.csv"

features:
  rsi_period: 14
  roll_means: [5, 10, 20]  # Added 20-day for weekly trends
  roll_stds: [5, 10, 20]   # Added 20-day for weekly volatility
  macd:
    fast: 12
    slow: 26
    signal: 9
  volume_windows: [5, 20]  # Added 50-day for longer-term volume trends

window:
  size: 10  # 20 days (4 weeks) look-back for weekly prediction
  stride: 1

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  chronological: true

model:
  type: "lstm"           # options: "lstm" | "cnn1d"
  hidden_size: 32
  num_layers: 1
  dropout: 0.3

train:
  epochs: 30
  batch_size: 32
  lr: 0.001
  optimizer: "adam"
  early_stop_patience: 7  # Slightly more patience for weekly prediction
  task: "classification" # or "regression"
  seed: 42

paths:
  outdir: "artifacts/"

