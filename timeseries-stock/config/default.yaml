data:
  input_csv: "data/raw/SAMPLE.csv"  # Use SAMPLE.csv for testing, replace with your data
  date_col: "date"
  cols: ["open", "high", "low", "close", "volume"]
  target: "return"   # options: "direction" | "return"
  prediction_horizon: 5  # days ahead to predict (1=next day, 5=next week)
  cache_processed: true

sentiment:
  enabled: false # Set to true to include sentiment features
  csv_path: "data/raw/Daily News Sentiment Index.csv"

fear_greed:
  enabled: true  # Set to true to include Fear & Greed Index features
  csv_path: "data/raw/Fear and Greed Index Data - Daily Interpolated.csv"

features:
  rsi_period: 14
  roll_means: [5, 20]      # Keep short-term (5) and medium-term (20), drop redundant 10
  roll_stds: [10]          # Keep mid-range volatility, drop 5 and 20 (highly correlated)
  macd:
    fast: 12
    slow: 26
    signal: 9
  volume_windows: [20]     # Keep medium-term only, drop redundant 5 and 50

window:
  size: 10  # 20 days (4 weeks) look-back for weekly prediction
  stride: 1

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  chronological: true

model:
  type: "lstm"           # options: "lstm" | "cnn1d"
  hidden_size: 64
  num_layers: 2
  dropout: 0.5

train:
  epochs: 200
  batch_size: 32
  lr: 0.00001
  optimizer: "adam"
  early_stop_patience: 20
  task: "classification"
  seed: 32

  weight_decay: 0.01  # L2 regularization
  
  # Loss function configuration
  loss_function: "huber_direction"  # options: "mse", "direction_mse", "weighted_direction_mse", "huber_direction"
  direction_weight: 1  # Weight for directional penalty (higher = more emphasis on direction)

paths:
  outdir: "artifacts/"

